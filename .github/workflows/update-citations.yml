name: Update Google Scholar Citations

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    paths:
      - 'scripts/update_citations.py'
      - '.github/workflows/update-citations.yml'

jobs:
  update-citations:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run citation update script
      run: |
        cd scripts
        python update_citations.py

    - name: Check if citations were updated
      id: check_changes
      run: |
        if git diff --quiet about/gs_data_shieldsio.json; then
          echo "No changes in citations"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "Citations updated"
          echo "has_changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push if changed
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add about/gs_data_shieldsio.json
        git commit -m "Update citation count from Google Scholar"
        git push